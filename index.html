<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cờ Vua Đại Chiến - Full P2P</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        body { font-family: '-apple-system', sans-serif; background-color: #1a1c1e; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .lobby-container { background: #23272a; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; margin-top: 20px; border: 1px solid #34495e; }
        .lobby-input { width: 85%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #4f5d73; background: #2f3542; color: white; text-align: center; }
        .lobby-btn { background: #27ae60; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; margin: 5px; font-weight: bold; }
        .game-wrapper { position: relative; width: 480px; max-width: 94vw; display: none; margin-top: 20px; }
        #my-board { width: 100%; border-radius: 8px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="lobby-container" id="lobby-panel">
        <h2>♟️ Sảnh Chờ</h2>
        <input type="text" class="lobby-input" id="my-username-input" placeholder="Tên định danh...">
        <button class="lobby-btn" id="btn-lock-username">Kích Hoạt Online</button>
        <div id="lobby-status">Vui lòng kích hoạt...</div>
        <div id="add-friend-zone" class="hidden">
            <input type="text" class="lobby-input" id="friend-username-input" placeholder="Tên bạn bè...">
            <button class="lobby-btn" id="btn-invite">➕ Mời chơi</button>
        </div>
    </div>

    <div class="game-wrapper" id="board-wrapper">
        <div id="my-board"></div>
        <div id="game-status" style="text-align:center; margin-top:10px;">Đang chờ...</div>
        <button class="lobby-btn" id="btn-auto-ai" style="background:#8e44ad; width:100%;">🤖 AI Đánh Hộ: TẮT</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

    <script>
        let game = new Chess(), board = null, peer = null, conn = null, myRole = null, isMatchStarted = false, autoAI = false;

        // 1. Kích hoạt
        $('#btn-lock-username').on('click', function() {
            let name = "chess_user_" + $('#my-username-input').val().trim().toLowerCase();
            peer = new Peer(name);
            peer.on('open', () => {
                $('#lobby-status').text('🟢 Online: ' + name);
                $('#add-friend-zone').removeClass('hidden');
                $(this).hide();
            });
            peer.on('connection', (c) => {
                conn = c;
                setupEvents();
            });
        });

        // 2. Mời chơi
        $('#btn-invite').on('click', function() {
            let friendId = "chess_user_" + $('#friend-username-input').val().trim().toLowerCase();
            conn = peer.connect(friendId);
            setupEvents();
            conn.on('open', () => {
                conn.send({ type: 'invite', from: $('#my-username-input').val() });
                $('#lobby-status').text('⏳ Đang chờ xác nhận...');
            });
        });

        // 3. Logic trung tâm
        function setupEvents() {
            conn.on('data', (data) => {
                if (data.type === 'invite') {
                    if (confirm(data.from + " muốn thách đấu! Bạn đồng ý không?")) {
                        conn.send({ type: 'accept' });
                        myRole = 'black';
                        startMatch();
                    }
                } else if (data.type === 'accept') {
                    myRole = 'white';
                    startMatch();
                } else if (data.type === 'move') {
                    game.move(data.move);
                    board.position(game.fen());
                }
            });
        }

        // 4. Bắt đầu trận
        function startMatch() {
            isMatchStarted = true;
            $('#lobby-panel').hide();
            $('#board-wrapper').show();
            board = Chessboard('my-board', {
                draggable: true,
                position: 'start',
                orientation: myRole,
                onDrop: (s, t) => {
                    let move = game.move({ from: s, to: t, promotion: 'q' });
                    if (!move) return 'snapback';
                    conn.send({ type: 'move', move: { from: s, to: t } });
                }
            });
        }

        // 5. Tính năng AI
        $('#btn-auto-ai').on('click', function() {
            autoAI = !autoAI;
            $(this).text(autoAI ? '🤖 AI Đánh Hộ: BẬT' : '🤖 AI Đánh Hộ: TẮT');
        });
    </script>
</body>
</html>
