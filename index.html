<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cờ Vua P2P - Giao Diện Chuẩn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: #2c3e50; color: white; text-align: center; font-family: sans-serif; }
        #board { width: 400px; margin: 20px auto; }
        .controls { background: #34495e; padding: 20px; border-radius: 10px; display: inline-block; }
        input { padding: 8px; width: 150px; }
        button { padding: 8px 15px; cursor: pointer; background: #27ae60; color: white; border: none; }
    </style>
</head>
<body>
    <h2>Cờ Vua Đối Kháng</h2>
    <div class="controls">
        <input type="text" id="myId" placeholder="Tên của bạn">
        <button onclick="init()">Đăng ký</button><br><br>
        <input type="text" id="targetId" placeholder="Tên đối thủ">
        <button onclick="invite()">Mời chơi</button>
    </div>
    <div id="board"></div>

    <script>
        let board = Chessboard('board', 'start');
        let game = new Chess();
        let peer;

        function init() {
            let name = document.getElementById('myId').value.trim();
            peer = new Peer("chess_v1_" + name);
            peer.on('open', (id) => alert("Đã online với tên: " + id));
            peer.on('connection', (conn) => {
                alert("Đối thủ " + conn.peer + " đã kết nối!");
                conn.on('data', (data) => {
                    game.move(data);
                    board.position(game.fen());
                });
            });
        }

        function invite() {
            let target = document.getElementById('targetId').value.trim();
            let conn = peer.connect("chess_v1_" + target);
            conn.on('open', () => alert("Kết nối thành công! Bắt đầu di chuyển quân."));
        }

        // Cấu hình kéo thả quân cờ
        function onDrop(source, target) {
            let move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';
        }
        board = Chessboard('board', { draggable: true, position: 'start', onDrop: onDrop });
    </script>
</body>
</html>
