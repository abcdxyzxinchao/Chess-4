<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cờ Vua Đại Chiến - Tự Động Trực Tuyến</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    
    <style>
        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1c1e; color: #fff; margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; justify-content: center; box-sizing: border-box;
        }
        .lobby-container {
            background: #23272a; padding: 20px; border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); width: 90%; max-width: 400px;
            text-align: center; margin-bottom: 20px; border: 1px solid #34495e;
        }
        .lobby-input {
            width: 85%; padding: 10px; margin: 8px 0; font-size: 15px;
            border-radius: 6px; border: 1px solid #4f5d73; text-align: center; background: #2f3542; color: white;
        }
        .lobby-btn {
            background: #27ae60; color: white; border: none; padding: 10px 18px;
            font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; margin: 5px;
        }
        .lobby-btn.blue { background: #2980b9; }
        .lobby-btn.purple { background: #8e44ad; }
        
        /* KHU VỰC TÀI KHOẢN */
        .account-box { background: #1c2022; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center; }
        
        /* KHU VỰC DANH SÁCH KẾT BẠN */
        .friend-section { margin-top: 20px; padding-top: 15px; border-top: 2px dashed #34495e; text-align: left; }
        .friend-title { font-size: 14px; color: #f1c40f; font-weight: bold; margin-bottom: 10px; text-align: center; }
        .friend-list { list-style: none; padding: 0; margin: 0; max-height: 180px; overflow-y: auto; }
        .friend-item { 
            display: flex; justify-content: space-between; align-items: center;
            background: #2f3542; padding: 10px 12px; border-radius: 6px; margin-bottom: 8px; font-size: 13px;
        }
        .status-dot { font-size: 11px; font-weight: bold; }
        .status-online { color: #2ecc71; }
        .status-offline { color: #95a5a6; }
        .invite-btn { background: #2ecc71; border: none; color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .delete-btn { background: #e74c3c; border: none; color: white; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-left: 5px; }

        .game-wrapper { position: relative; width: 480px; max-width: 94vw; aspect-ratio: 1 / 1; margin-bottom: 70px; display: none; }
        #my-board { width: 100%; height: 100%; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .bottom-trigger-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #2b2d30;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.4); padding: 12px; box-sizing: border-box;
            display: none; justify-content: center; z-index: 90;
        }
        .menu-toggle-btn { background: #3498db; color: white; border: none; width: 90%; max-width: 400px; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .bottom-sheet-menu {
            position: fixed; bottom: -100%; left: 0; width: 100%; max-height: 80vh;
            background: #202224; border-radius: 20px 20px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
            z-index: 100; transition: bottom 0.25s ease; padding: 20px; box-sizing: border-box; overflow-y: auto;
        }
        .bottom-sheet-menu.open { bottom: 0; }
        .drag-handle { width: 40px; height: 5px; background: #555; border-radius: 3px; margin: -8px auto 15px auto; }
        .menu-section { margin-bottom: 15px; }
        .section-title { font-size: 11px; text-transform: uppercase; color: #7f8c8d; margin-bottom: 6px; font-weight: bold; }
        .status-container { display: flex; background: #161719; border-radius: 6px; border-left: 4px solid #3498db; padding: 10px; gap: 15px; align-items: center; justify-content: space-between; }
        .status-text-side { flex: 1; font-size: 13px; }
        .mini-board-side { width: 110px; height: 110px; flex-shrink: 0; border-radius: 6px; overflow: hidden; border: 2px solid #3d4145; }
        .menu-btn { width: 100%; padding: 12px; font-size: 13px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; margin-bottom: 8px; }
        .btn-purple { background-color: #8e44ad; }
        .btn-purple.active { background-color: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
        .highlight-hint::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 28%; height: 28%; background-color: rgba(46, 204, 113, 0.6); border-radius: 50%; pointer-events: none; z-index: 2; }
        .highlight-selected { box-shadow: inset 0 0 3px 3px #f1c40f; }
        .result-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; }
        .result-card { background: #2c3e50; border: 3px solid #f1c40f; border-radius: 12px; width: 85%; max-width: 330px; padding: 25px; text-align: center; }
        .result-title { font-size: 22px; font-weight: bold; margin-bottom: 10px; color: #f1c40f; }
        .result-desc { font-size: 14px; color: #ecf0f1; margin-bottom: 20px; }

        /* ẨN QUẢNG CÁO */
        div[style*="position: fixed"][style*="z-index: 2147483647"], div[id*="tiiny"], div[class*="tiiny"], iframe, img[alt*="Hosted on Tiiny.host"] {
            display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; width: 0px !important; height: 0px !important;
        }
    </style>
</head>
<body>

    <div class="lobby-container" id="lobby-panel">
        <h2 style="margin: 0 0 10px 0; color: #3498db;">♟️ Sảnh Chờ Bạn Bè</h2>
        
        <!-- KHU VỰC HIỂN THỊ TÊN HOẶC ĐĂNG KÝ TÊN LẦN ĐẦU -->
        <div class="account-box" id="account-zone">
            <!-- Giao diện đăng ký lần đầu -->
            <div id="register-ui">
                <div style="font-size: 13px; color: #a4b0be; margin-bottom: 6px;">Tạo tên duy nhất (Không đổi sau này):</div>
                <input type="text" class="lobby-input" id="my-username-input" placeholder="Nhập tên viết liền không dấu..." style="margin:0; width:90%;">
                <button class="lobby-btn purple" id="btn-lock-username" style="margin-top: 8px; font-size:13px;">🎯 Tạo Tài Khoản</button>
            </div>
            <!-- Giao diện khi đã có tên (Vào thẳng luôn) -->
            <div id="logged-ui" style="display: none;">
                <div style="font-size: 14px; color: #bdc3c7;">Xin chào thiết bị: <b style="color: #2ecc71; font-size: 16px;" id="txt-my-name">...</b></div>
            </div>
        </div>

        <div id="lobby-status" style="margin: 10px 0; font-weight: bold; color: #e67e22;">Đang kiểm tra thông tin máy...</div>

        <!-- KHU VỰC THÊM BẠN MỚI -->
        <div id="add-friend-zone" style="display: none; background: #1c2022; padding: 10px; border-radius: 8px;">
            <div style="font-size: 12px; color: #a4b0be; margin-bottom: 5px;">Thêm bạn bè vào danh sách:</div>
            <input type="text" class="lobby-input" id="friend-username-input" placeholder="Nhập chính xác tên của bạn..." style="width: 55%; padding: 6px; font-size: 13px; margin: 0;">
            <button class="lobby-btn blue" id="btn-add-friend" style="padding: 6px 12px; font-size: 13px; margin: 0 0 0 5px;">➕ Thêm</button>
        </div>

        <!-- DANH SÁCH BẠN BÈ TỰ ĐỘNG QUÉT ONLINE -->
        <div class="friend-section" id="friend-zone" style="display: none;">
            <div class="friend-title">👥 Danh Sách Bạn Bè</div>
            <ul class="friend-list" id="friend-list-items"></ul>
        </div>
    </div>

    <!-- KHU VỰC BÀN CỜ -->
    <div class="game-wrapper" id="board-wrapper">
        <div id="my-board"></div>
    </div>

    <div class="result-overlay" id="match-result-popup">
        <div class="result-card">
            <div class="result-title" id="res-title">KẾT THÚC!</div>
            <div class="result-desc" id="res-desc">Trận đấu kết thúc hoàn toàn.</div>
            <button class="lobby-btn" style="width: 100%;" onclick="location.reload()">🔄 Thoát Ra Sảnh Chờ</button>
        </div>
    </div>

    <div class="bottom-trigger-bar" id="trigger-bar">
        <button class="menu-toggle-btn" id="open-menu-trigger">🛠️ Cài Đặt Trận Đấu</button>
    </div>

    <div class="bottom-sheet-menu" id="side-panel">
        <div class="drag-handle"></div>
        <div class="menu-header-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="margin: 0; color: #3498db;" id="menu-role-title">Vai Trò: Kết nối...</h3>
            <button style="background: #3d4145; border: none; color: white; padding: 5px 10px; border-radius: 4px;" id="close-menu-trigger">Đóng X</button>
        </div>
        <div class="menu-section">
            <div class="section-title">Trạng thái bàn cờ</div>
            <div class="status-container">
                <div class="status-text-side">
                    <div id="game-status" style="font-weight: bold;">Đang chờ...</div>
                </div>
                <div class="mini-board-side" id="mini-board"></div>
            </div>
        </div>
        <div class="menu-section">
            <div class="section-title">Chế độ tự động trực tuyến</div>
            <button id="auto-mine-btn" class="menu-btn btn-purple">🤖 Để AI Máy Tôi Đánh Hộ: TẮT</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

    <script>
        let game = new Chess();
        let board = null, miniBoard = null;
        let myRole = null, peer = null, conn = null;
        let autoMineEnabled = false, isMoving = false, sourceSquare = null;
        let myRecentMoves = [];
        let myUsername = "";
        let scanInterval = null;

        // KHỞI ĐỘNG HỆ THỐNG: KIỂM TRA ĐĂNG NHẬP TỰ ĐỘNG
        $(document).ready(function() {
            let savedName = localStorage.getItem('chess_p2p_username');
            if (savedName) {
                // NẾU ĐÃ CÓ TÊN: Ẩn đăng ký, hiện lời chào và vào thẳng trạng thái Online!
                $('#register-ui').hide();
                $('#logged-ui').show();
                $('#txt-my-name').text(savedName);
                myUsername = "chess_user_" + savedName;
                initPeerNetwork();
            } else {
                // NẾU CHƯA CÓ TÊN: Bắt nhập tên lần đầu
                $('#lobby-status').text('👋 Chào mừng! Hãy tạo một tên duy nhất để chơi.');
            }
            renderFriends();
        });

        // XỬ LÝ ĐĂNG KÝ TÊN LẦN ĐẦU DUY NHẤT
        $('#btn-lock-username').on('click', function() {
            let name = $('#my-username-input').val().trim().toLowerCase();
            if(!name || name.length < 3 || !/^[a-z0-9]+$/.test(name)) {
                alert("Tên từ 3 ký tự trở lên, viết liền, chỉ gồm chữ cái và số, không dấu!");
                return;
            }
            localStorage.setItem('chess_p2p_username', name);
            $('#register-ui').hide();
            $('#logged-ui').show();
            $('#txt-my-name').text(name);
            myUsername = "chess_user_" + name;
            initPeerNetwork();
        });

        // KẾT NỐI MẠNG ĐÁM MÂY TỰ ĐỘNG
        function initPeerNetwork() {
            $('#lobby-status').text('⏳ Đang tự động kết nối mạng trực tuyến...');
            peer = new Peer(myUsername);

            peer.on('open', (id) => {
                $('#lobby-status').html(`🟢 Bạn đang trực tuyến! Sẵn sàng nhận lời mời.`);
                $('#add-friend-zone').show();
                $('#friend-zone').show();
                
                // Tự động quét trạng thái bạn bè liên tục mỗi 3 giây
                checkFriendsOnlineStatus();
                if(scanInterval) clearInterval(scanInterval);
                scanInterval = setInterval(checkFriendsOnlineStatus, 3000);
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnectionEvents();
                myRole = 'black'; // Người nhận lời mời đi sau (Quân Đen)
                startMatch();
            });

            peer.on('error', (err) => {
                if(err.type === 'unavailable-id') {
                    alert("Tên tài khoản này đang có người khác đăng nhập trực tuyến! Vui lòng xoá dữ liệu trang web hoặc chọn tên cực độc khác.");
                    localStorage.removeItem('chess_p2p_username');
                    location.reload();
                }
            });
        }

        // THÊM BẠN BÈ VÀO DANH SÁCH
        $('#btn-add-friend').on('click', function() {
            let friendName = $('#friend-username-input').val().trim().toLowerCase();
            let currentMe = localStorage.getItem('chess_p2p_username');
            if(!friendName || friendName === currentMe) {
                alert("Tên bạn bè không hợp lệ hoặc bạn tự thêm chính mình!");
                return;
            }
            let friends = JSON.parse(localStorage.getItem('chess_friends_list')) || [];
            if(!friends.includes(friendName)) {
                friends.push(friendName);
                localStorage.setItem('chess_friends_list', JSON.stringify(friends));
            }
            $('#friend-username-input').val('');
            renderFriends();
            checkFriendsOnlineStatus();
        });

        function renderFriends() {
            let friends = JSON.parse(localStorage.getItem('chess_friends_list')) || [];
            let html = '';
            if(friends.length === 0) {
                html = '<div style="color:#7f8c8d; font-size:12px; text-align:center; padding:10px;">Danh sách trống. Hãy thêm tên bạn bè ở trên!</div>';
            } else {
                friends.forEach(name => {
                    html += `<li class="friend-item" id="f-item-${name}">
                        <span>👤 <b>${name}</b></span>
                        <div style="display:flex; align-items:center;">
                            <span class="status-dot status-offline" id="status-${name}">⚫ Ngoại tuyến</span>
                            <div id="action-${name}" style="margin-left:8px;"></div>
                            <button class="delete-btn" onclick="deleteFriend('${name}')">❌</button>
                        </div>
                    </li>`;
                });
            }
            $('#friend-list-items').html(html);
        }

        function deleteFriend(name) {
            let friends = JSON.parse(localStorage.getItem('chess_friends_list')) || [];
            friends = friends.filter(f => f !== name);
            localStorage.setItem('chess_friends_list', JSON.stringify(friends));
            renderFriends();
        }

        // CƠ CHẾ QUÉT NGẦM THỜI GIAN THỰC ĐỂ HIỂN THỊ NÚT "+" MỜI CHƠI
        function checkFriendsOnlineStatus() {
            if(!peer || peer.destroyed) return;
            let friends = JSON.parse(localStorage.getItem('chess_friends_list')) || [];
            
            friends.forEach(name => {
                let friendId = "chess_user_" + name;
                let testConn = peer.connect(friendId, { metadata: { type: 'ping' } });
                
                testConn.on('open', () => {
                    // Bạn đang mở link -> Chuyển thành Đèn Xanh lá và Hiện nút mời luôn!
                    $(`#status-${name}`).removeClass('status-offline').addClass('status-online').text('🟢 Đang trong game');
                    if($(`#action-${name} button`).length === 0) {
                        $(`#action-${name}`).html(`<button class="invite-btn" onclick="inviteFriendToPlay('${name}')">➕ Mời chơi</button>`);
                    }
                    testConn.close();
                });
                
                testConn.on('error', () => {
                    resetToOffline(name);
                });

                setTimeout(() => {
                    // Nếu kết nối thử treo quá 1.5 giây mà không mở được -> Bạn đã thoát link
                    if (testConn && !testConn.open) {
                        resetToOffline(name);
                        testConn.close();
                    }
                }, 1500);
            });
        }

        function resetToOffline(name) {
            $(`#status-${name}`).removeClass('status-online').addClass('status-offline').text('⚫ Ngoại tuyến');
            $(`#action-${name}`).html('');
        }

        // BẤM MỜI CHƠI (TỰ ĐỘNG KÉO VÀO TRẬN ĐẤU)
        function inviteFriendToPlay(name) {
            if(scanInterval) clearInterval(scanInterval); // Tạm dừng quét khi vào trận
            let targetId = "chess_user_" + name;
            $('#lobby-status').text(`⏳ Đang kết nối trực tiếp đến ${name}...`);
            conn = peer.connect(targetId);
            setupConnectionEvents();
            myRole = 'white'; // Người chủ động bấm mời đi trước (Quân Trắng)
        }

        // VẬN HÀNH GAME CỜ VUA P2P
        function setupConnectionEvents() {
            conn.on('open', () => { startMatch(); });
            conn.on('data', (data) => {
                if (data.type === 'move') {
                    game.move(data.move); board.position(game.fen(), true);
                    updateStatus(); setTimeout(() => { checkAndTriggerAutoMove(); }, 400);
                }
            });
            conn.on('close', () => { alert('Đối thủ đã rời game hoặc ngắt kết nối!'); location.reload(); });
        }

        function startMatch() {
            if(scanInterval) clearInterval(scanInterval);
            $('#lobby-panel').hide(); $('#board-wrapper').css('display', 'block'); $('#trigger-bar').css('display', 'flex');
            const pTheme = 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png';
            board = Chessboard('my-board', { draggable: false, position: 'start', orientation: myRole, pieceTheme: pTheme });
            miniBoard = Chessboard('mini-board', { draggable: false, position: 'start', orientation: myRole, pieceTheme: pTheme });
            $('#menu-role-title').text(`Phe Quân ${myRole === 'white' ? 'Trắng' : 'Đen'}`);
            updateStatus(); setTimeout(() => { checkAndTriggerAutoMove(); }, 500);
        }

        // --- HỆ THỐNG TRÍ TUỆ NHÂN TẠO AI ĐÁNH HỘ ---
        const pieceValues = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
        function evaluateBoard(chessGame) {
            let total = 0;
            chessGame.board().forEach((row) => {
                row.forEach((piece) => { if (piece) { let val = pieceValues[piece.type]; total += (piece.color === 'w') ? val : -val; } });
            });
            return total;
        }

        function calculateBestMove(currentGame) {
            let moves = currentGame.moves({ verbose: true });
            if (moves.length === 0) return null;
            let currentTurn = currentGame.turn();
            let bestMovesList = []; let bestValue = (currentTurn === 'w') ? -99999 : 99999;
            for (let i = 0; i < moves.length; i++) {
                let moveCandidate = moves[i]; currentGame.move(moveCandidate); let boardValue = evaluateBoard(currentGame); currentGame.undo();
                let moveString = moveCandidate.from + moveCandidate.to;
                if (myRecentMoves.includes(moveString)) boardValue += (currentTurn === 'w') ? -800 : 800;
                if (currentTurn === 'w') {
                    if (boardValue > bestValue) { bestValue = boardValue; bestMovesList = [moveCandidate]; }
                    else if (boardValue === bestValue) { bestMovesList.push(moveCandidate); }
                } else {
                    if (boardValue < bestValue) { bestValue = boardValue; bestMovesList = [moveCandidate]; }
                    else if (boardValue === bestValue) { bestMovesList.push(moveCandidate); }
                }
            }
            return bestMovesList[Math.floor(Math.random() * bestMovesList.length)] || moves[0];
        }

        function checkAndTriggerAutoMove() {
            if (game.game_over() || isMoving) { checkGameEnding(); return; }
            let currentTurn = game.turn();
            let isMyTurn = (myRole === 'white' && currentTurn === 'w') || (myRole === 'black' && currentTurn === 'b');
            if (autoMineEnabled && isMyTurn) {
                isMoving = true; let bestMove = calculateBestMove(game);
                if (bestMove) {
                    myRecentMoves.push(bestMove.from + bestMove.to); if (myRecentMoves.length > 4) myRecentMoves.shift();
                    let moveObj = { from: bestMove.from, to: bestMove.to, promotion: 'q' };
                    game.move(moveObj); board.position(game.fen(), true);
                    conn.send({ type: 'move', move: moveObj }); updateStatus(); isMoving = false; checkGameEnding();
                } else { isMoving = false; }
            }
        }

        function onSquareClick(square) {
            if (game.game_over() || isMoving) return;
            let currentTurn = game.turn();
            let isMyTurn = (myRole === 'white' && currentTurn === 'w') || (myRole === 'black' && currentTurn === 'b');
            if (!isMyTurn || autoMineEnabled) return;
            let piece = game.get(square);
            if (sourceSquare === null) {
                if (piece && piece.color === game.turn()) {
                    sourceSquare = square; removeHighlights();
                    $('#my-board .square-' + square).addClass('highlight-selected');
                    game.moves({ square: square, verbose: true }).forEach(m => $('#my-board .square-' + m.to).addClass('highlight-hint'));
                }
            } else {
                let moveObj = { from: sourceSquare, to: square, promotion: 'q' };
                let move = game.move(moveObj);
                if (move === null) {
                    sourceSquare = null; removeHighlights(); if (piece && piece.color === game.turn()) onSquareClick(square);
                } else {
                    board.position(game.fen()); sourceSquare = null; removeHighlights();
                    conn.send({ type: 'move', move: moveObj }); updateStatus(); checkGameEnding();
                }
            }
        }

        function removeHighlights() { $('#my-board .square-55d63').removeClass('highlight-hint highlight-selected'); }
        function updateStatus() {
            let currentTurn = game.turn();
            let isMyTurn = (myRole === 'white' && currentTurn === 'w') || (myRole === 'black' && currentTurn === 'b');
            let txt = isMyTurn ? "<span style='color:#2ecc71;'>Lượt của BẠN!</span>" : "<span style='color:#7f8c8d;'>Đợi đối thủ...</span>";
            if (game.in_check()) txt += " <b style='color:#e74c3c;'>(CHIẾU)</b>";
            $('#game-status').html(txt); if (miniBoard) miniBoard.position(game.fen(), false);
        }

        function checkGameEnding() {
            if (!game.game_over()) return;
            let title = "HÒA CỜ!"; let desc = "Hai bên bất phân thắng bại.";
            if (game.in_checkmate()) { let winner = game.turn() === 'w' ? 'QUÂN ĐEN' : 'QUÂN TRẮNG'; title = `🏆 ${winner} THẮNG!`; desc = "Chiếu bí."; }
            $('#res-title').text(title); $('#res-desc').text(desc); $('#match-result-popup').css('display', 'flex');
        }

        $('#my-board').on('click', '.square-55d63', function() { onSquareClick($(this).attr('data-square')); });
        $('#open-menu-trigger').on('click', () => { $('#side-panel').addClass('open'); setTimeout(() => { if (miniBoard) { miniBoard.resize(); miniBoard.position(game.fen(), false); } }, 350); });
        $('#close-menu-trigger').on('click', () => $('#side-panel').removeClass('open'));
        $('#auto-mine-btn').on('click', function() { autoMineEnabled = !autoMineEnabled; if (autoMineEnabled) { $(this).addClass('active').text('🤖 Để AI Máy Tôi Đánh Hộ: BẬT'); checkAndTriggerAutoMove(); } else { $(this).removeClass('active').text('🤖 Để AI Máy Tôi Đánh Hộ: TẮT'); } });
    </script>
</body>
</html>
