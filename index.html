<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cờ Vua P2P - Bản Ổn Định</title>
    <!-- Thư viện cần thiết -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: #2c3e50; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .box { background: #34495e; padding: 20px; border-radius: 10px; display: inline-block; }
        input { padding: 10px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Cờ Vua P2P</h2>
        <input type="text" id="myId" placeholder="Tên của bạn...">
        <button onclick="init()">Đăng ký</button>
        <div id="status"></div>
        <hr>
        <input type="text" id="targetId" placeholder="Tên bạn bè...">
        <button onclick="invite()">Mời chơi</button>
    </div>

    <script>
        let peer;
        function init() {
            let name = document.getElementById('myId').value.trim();
            if(!name) return alert("Nhập tên!");
            // Tạo ID với tiền tố để tránh trùng lặp
            peer = new Peer("chess_v1_" + name);
            peer.on('open', (id) => {
                document.getElementById('status').innerText = "Trạng thái: Trực tuyến (ID: " + id + ")";
            });
            peer.on('connection', (conn) => {
                alert("Có lời mời từ: " + conn.peer);
                // Tại đây sẽ bắt đầu hàm setup bàn cờ
            });
        }

        function invite() {
            let target = document.getElementById('targetId').value.trim();
            let conn = peer.connect("chess_v1_" + target);
            conn.on('open', () => alert("Đã kết nối với " + target));
            conn.on('error', (err) => alert("Không thể kết nối. Kiểm tra tên hoặc mạng."));
        }
    </script>
</body>
</html>
