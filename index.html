<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cờ Vua P2P - Đầy đủ bàn cờ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        body { background: #1a1c1e; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; }
        .lobby-container { background: #23272a; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; margin-top: 20px; }
        .game-wrapper { display: none; width: 100%; max-width: 480px; margin-top: 20px; }
        #my-board { width: 100%; border: 2px solid #34495e; }
        .btn { padding: 12px 20px; cursor: pointer; border-radius: 6px; border: none; font-weight: bold; background: #3498db; color: white; margin: 10px; width: 80%; }
    </style>
</head>
<body>

<div class="lobby-container" id="lobby-panel">
    <h2>♟️ Cờ Vua P2P</h2>
    <input type="text" id="my-name" placeholder="Tên của bạn..." style="padding: 10px; width: 80%;">
    <button class="btn" id="btn-login">Kích Hoạt Online</button>
    <div id="status">Trạng thái: Offline</div>
    
    <div id="friend-zone" style="display:none;">
        <input type="text" id="friend-name" placeholder="Tên bạn bè..." style="padding: 10px; width: 80%;">
        <button class="btn" style="background:#27ae60" id="btn-invite">➕ Mời chơi</button>
    </div>
</div>

<div class="game-wrapper" id="board-wrapper">
    <div id="my-board"></div>
    <div id="game-info" style="margin-top:10px; text-align:center;">Trận đấu đang diễn ra...</div>
    <button class="btn" id="btn-auto-ai" style="background:#8e44ad;">🤖 AI Đánh Hộ: TẮT</button>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

<script>
    let game = new Chess(), board, peer, conn, myRole, autoAI = false;

    // Khởi tạo
    $('#btn-login').on('click', function() {
        let name = "chess_" + $('#my-name').val().trim().toLowerCase();
        peer = new Peer(name);
        peer.on('open', () => {
            $('#status').text("Online: " + name);
            $('#friend-zone').show();
            $(this).hide();
        });
        peer.on('connection', (c) => { conn = c; setupEvents(); });
    });

    $('#btn-invite').on('click', function() {
        let target = "chess_" + $('#friend-name').val().trim().toLowerCase();
        conn = peer.connect(target);
        setupEvents();
        conn.on('open', () => {
            conn.send({ type: 'invite', from: $('#my-name').val() });
            $('#status').text("Đang chờ xác nhận...");
        });
    });

    function setupEvents() {
        conn.on('data', (data) => {
            if (data.type === 'invite') {
                if (confirm(data.from + " muốn thách đấu! Đồng ý?")) {
                    conn.send({ type: 'accept' });
                    myRole = 'black';
                    startMatch();
                }
            } else if (data.type === 'accept') {
                myRole = 'white';
                startMatch();
            } else if (data.type === 'move') {
                game.move(data.move);
                board.position(game.fen());
                checkAI();
            }
        });
    }

    function startMatch() {
        $('#lobby-panel').hide();
        $('#board-wrapper').show();
        
        // KHỞI TẠO BÀN CỜ ĐÚNG LÚC ĐÃ HIỂN THỊ
        board = Chessboard('my-board', {
            draggable: true,
            position: 'start',
            orientation: myRole,
            onDrop: (s, t) => {
                let move = game.move({ from: s, to: t, promotion: 'q' });
                if (!move) return 'snapback';
                conn.send({ type: 'move', move: { from: s, to: t } });
                checkAI();
            }
        });
    }

    function checkAI() {
        if(autoAI && game.turn() === (myRole === 'white' ? 'b' : 'w')) {
            let moves = game.moves({verbose: true});
            let m = moves[Math.floor(Math.random() * moves.length)];
            game.move(m);
            board.position(game.fen());
            conn.send({ type: 'move', move: m });
        }
    }

    $('#btn-auto-ai').on('click', function() {
        autoAI = !autoAI;
        $(this).text(autoAI ? '🤖 AI Đánh Hộ: BẬT' : '🤖 AI Đánh Hộ: TẮT');
    });
</script>
</body>
</html>
