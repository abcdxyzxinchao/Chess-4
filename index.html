<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cờ Vua P2P Pro - Bấm Giờ Thi Đấu</title>
    <!-- Thư viện giữ nguyên như file trước của bạn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
</head>
<body>
    <!-- Giao diện giữ nguyên, bổ sung đồng hồ thi đấu -->
    <div id="clock-container" style="text-align: center; font-size: 24px; font-weight: bold; margin: 10px;">
        <span id="white-clock">10:00</span> | <span id="black-clock">10:00</span>
    </div>

    <!-- Script Logic Thi Đấu -->
    <script>
        let whiteTime = 600; // 10 phút
        let blackTime = 600;
        let timerInterval;

        function startTimer() {
            timerInterval = setInterval(() => {
                if (game.turn() === 'w') {
                    whiteTime--;
                    updateClockDisplay();
                    if (whiteTime <= 0) alert("Quân Trắng Hết Giờ!");
                } else {
                    blackTime--;
                    updateClockDisplay();
                    if (blackTime <= 0) alert("Quân Đen Hết Giờ!");
                }
            }, 1000);
        }

        function updateClockDisplay() {
            document.getElementById('white-clock').innerText = formatTime(whiteTime);
            document.getElementById('black-clock').innerText = formatTime(blackTime);
        }

        function formatTime(seconds) {
            let m = Math.floor(seconds / 60);
            let s = seconds % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }
    </script>
</body>
</html>
